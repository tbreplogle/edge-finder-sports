
name: MLB and Weekly Models

on:
  schedule:
    # 07:05 America/Chicago = 12:05 UTC (standard) / 13:05 UTC (DST)
    - cron: '5 12 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build worker image
        run: docker build -f docker/worker.Dockerfile -t playedge-worker .
      - name: Run MLB and R models
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: docker run --rm -e DATABASE_URL playedge-worker
