name: 1-Daily MLB Team Hitting Stats Update

on:
  schedule:
    - cron: '0 14 * * *'          # 09:00 AM CT
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PUPPETEER_SKIP_DOWNLOAD:    'true'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 18 }

      - name: Restore npm cache
        id: restore-cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: linux-npm-${{ hashFiles('**/package-lock.json') }}-v1
          restore-keys: |
            linux-npm-

      - name: Install JS deps
        run: npm install --no-audit --no-fund

      - name: Save npm cache
        if: steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: linux-npm-${{ hashFiles('**/package-lock.json') }}-v1

      - name: Show environment information
        run: |
          echo "Node $(node -v) / npm $(npm -v)"
          pwd && ls -la

      - name: Run MLB hitting stats scraper
        working-directory: workers
        run: node scrapeTeamHittingStats.js
        env:
          DEBUG: 'true'

      - name: Verify scrape results
        if: success()              # only run if previous steps succeeded
        run: |
          if [ -f scrape-result.json ] ; then
            cat scrape-result.json
          elif [ -f workers/../scrape-result.json ] ; then
            cat workers/../scrape-result.json
          else
            echo "::warning ::scrape-result.json not found (scraper may have skipped writing it)"
          fi