name: Sync CBB Data & Predictions

on:
  # Run every day at 08:00 UTC (~2am CST / 3am CDT)
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch: {}

env:
  # Update this each season if you want to lock to a specific year
  CBB_SEASON: '2025'

jobs:
  sync-cbb:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CFBD_API_KEY:              ${{ secrets.CFBD_API_KEY }}  # same key for CBB API
      PUPPETEER_SKIP_DOWNLOAD:   'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: linux-npm-${{ hashFiles('**/package-lock.json') }}-v1
          restore-keys: |
            linux-npm-

      - name: Install deps (workers/)
        working-directory: workers
        run: npm install --no-audit --no-fund

      # 1) Teams
      - name: Sync CBB Teams
        working-directory: workers
        run: node syncCbbTeams.js $CBB_SEASON

      # 2) Games (schedule + results)
      - name: Sync CBB Games
        working-directory: workers
        run: node syncCbbGames.js $CBB_SEASON

      # 3) Season-to-date team stats
      - name: Sync CBB Team Season Stats
        working-directory: workers
        run: node syncCbbTeamSeasonStats.js $CBB_SEASON

      # 4) Betting lines (today + near future)
      - name: Sync CBB Betting Lines
        working-directory: workers
        run: node syncCbbGameLines.js $CBB_SEASON

      # 5) Model predictions for this season's games
      - name: Score CBB Games (Model Predictions)
        working-directory: workers
        run: node scoreCbbGames.js $CBB_SEASON
