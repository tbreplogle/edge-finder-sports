name: Daily MLB Results Scraper

on:
  schedule:
    - cron: '0 12 * * *'    # 07:00 AM CT
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PUPPETEER_SKIP_DOWNLOAD:   'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      # ─── Cache workers/node_modules ───
      - name: Restore workers cache
        id: cache-workers
        uses: actions/cache@v4
        with:
          path: workers/node_modules
          key: linux-npm-workers-${{ hashFiles('workers/package.json') }}-v1
          restore-keys: |
            linux-npm-workers-

      # ─── Install in workers/ ───
      - name: Install JS deps (workers/)
        working-directory: workers
        run: npm install --no-audit --no-fund

      # ─── Save cache if it was a miss ───
      - name: Save workers cache
        if: steps.cache-workers.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: workers/node_modules
          key: linux-npm-workers-${{ hashFiles('workers/package.json') }}-v1

      # ─── Run your scraper ───
      - name: Scrape & save yesterday's results
        working-directory: workers
        run: node scrapeDailyResults.js
