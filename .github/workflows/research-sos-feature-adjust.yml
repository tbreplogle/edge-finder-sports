name: Research SOS Feature Adjustment

on:
  push:
    branches:
      - research-sos-feature-adjust-20260909
    paths:
      - research/sos_feature_adjust_backtest.py
      - research/sos_feature_adjust_backtest_v3.py
      - research/sos_hybrid_backtest_v4.py
      - .github/workflows/research-sos-feature-adjust.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run hybrid feature-level plus damped WIN50 backtest
        run: python research/sos_hybrid_backtest_v4.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sos-hybrid-results-v4
          path: sos_hybrid_results_v4.json
          if-no-files-found: warn
