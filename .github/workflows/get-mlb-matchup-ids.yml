name: Daily MLB Matchup IDs Scraper

on:
  schedule:
    - cron: '0 13 * * *'   # 8:00 AM CT
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    # 1) repo checkout & Node
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 18

    # 2) restore ~/.npm + ~/.cache/puppeteer
    - name: Restore Node & Chrome caches
      id: restore-cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.npm
          ~/.cache/puppeteer
        key: linux-puppeteer-${{ hashFiles('workers/package-lock.json') }}-v1
        restore-keys: |
          linux-puppeteer-

    # 3) install deps (fast on cache hit)
    - name: Install JS deps
      working-directory: ./workers
      run: |
        npm ci --ignore-scripts
        # only download Chrome if not already cached
        if [ ! -d "$HOME/.cache/puppeteer" ]; then
          npx puppeteer@21.11.0 browsers install chrome
        else
          echo "✓ puppeteer browser already cached"
        fi

    # 4) save cache if not hit
    - name: Save Node & Chrome caches
      if: steps.restore-cache.outputs.cache-hit != 'true'
      uses: actions/cache@v4
      with:
        path: |
          ~/.npm
          ~/.cache/puppeteer
        key: linux-puppeteer-${{ hashFiles('workers/package-lock.json') }}-v1

    # 5) run scrapers (unchanged)
    - name: Scrape & save today's MLB matchups
      run: node workers/saveMatchupsToSupabase.js
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        DEBUG: 'true'

    - name: Scrape and save pitching stats
      run: node workers/scrapePitchingMatchups.js
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        DEBUG: 'false'

    - name: Log matchup IDs
      run: |
        if [ -f "scrape-result.json" ]; then
          cat scrape-result.json
        else
          echo "No scrape-result.json file found"
        fi
