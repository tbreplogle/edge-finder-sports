name: Daily MLB Team Hitting Stats Update

on:
  schedule:
    - cron: "0 13 * * *"     # 8 AM CT
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "18"

    # ---------- install ----------
    - name: Install dependencies
      run: npm install          # ← swapped
      env:
        PUPPETEER_SKIP_DOWNLOAD: "true"


    - name: Show environment information
      run: |
        echo "Node version: $(node -v)"
        echo "NPM  version: $(npm  -v)"
        echo "PWD: $(pwd)"
        ls -la

    - name: Check required secrets
      run: |
        [ -z "${{ secrets.SUPABASE_URL }}" ] && { echo "::error::SUPABASE_URL missing"; exit 1; }
        [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ] && { echo "::error::SUPABASE_SERVICE_ROLE_KEY missing"; exit 1; }
        echo "✅ Secrets present"

    - name: Run MLB hitting stats scraper
      id: scrape
      run: node workers/scrapeTeamHittingStats.js
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        DEBUG: "true"

    - name: Verify scrape results
      if: always()
      run: |
        echo "================ SCRAPE RESULTS ================"
        if [ -f "scrape-result.json" ]; then
          cat scrape-result.json
        else
          echo "::error::scrape-result.json missing"
          exit 1
        fi
