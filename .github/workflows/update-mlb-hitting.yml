
name: Daily MLB Team Hitting Stats Update

on:
  schedule:
    - cron: '0 13 * * *'  # every day at 8:00 AM CT (13:00 UTC)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
      - name: Check environment variables
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL environment variable is not set"
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY environment variable is not set"
            exit 1
          fi
          echo "Environment variables set correctly"
      - name: Run scraper with verbose logging
        run: node workers/scrapeTeamHittingStats.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEBUG: 'true'
      - name: Debug directory contents
        if: always()
        run: |
          echo "Directory contents:"
          ls -la
          echo "Working directory: $(pwd)"
      - name: Create GitHub annotation for success/failure
        if: always()
        run: |
          if [ -f "scrape-result.json" ]; then
            echo "scrape-result.json exists with content:"
            cat scrape-result.json
            echo "::notice::MLB stats scraping completed successfully. See scrape-result.json for details."
          else
            echo "::error::scrape-result.json file not found. Scraping likely failed."
            exit 1
          fi
