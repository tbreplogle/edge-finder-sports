
name: Daily MLB Team Hitting Stats Update

on:
  schedule:
    - cron: '0 13 * * *'  # every day at 8:00 AM CT (13:00 UTC)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
      - name: Run scraper with verbose logging
        run: node workers/scrapeTeamHittingStats.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEBUG: 'true'
      - name: Create GitHub annotation for success/failure
        if: always()
        run: |
          if [ -f "scrape-result.json" ]; then
            echo "::notice::MLB stats scraping completed successfully. See scrape-result.json for details."
            cat scrape-result.json
          else
            echo "::error::MLB stats scraping failed. Check logs for details."
            exit 1
          fi
