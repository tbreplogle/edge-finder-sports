name: Daily MLB Team Hitting Stats Update

on:
  schedule:
    - cron: '0 13 * * *'          # 08 AM CT
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      ###################################################################
      # npm cache
      ###################################################################
      - name: Restore npm cache
        id: restore-cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: linux-npm-${{ hashFiles('workers/package-lock.json') }}-v1
          restore-keys: |
            linux-npm-

      ###################################################################
      # install deps
      ###################################################################
      - name: Install JS deps (workers/)
        working-directory: workers
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: npm install --no-audit --no-fund

      - name: Save npm cache
        if: steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: linux-npm-${{ hashFiles('workers/package-lock.json') }}-v1

      ###################################################################
      # show env info
      ###################################################################
      - name: Show env info
        run: |
          echo "Node $(node -v) / npm $(npm -v)"
          pwd && ls -la

      ###################################################################
      # Run hitting-stats scraper
      ###################################################################
      - name: Run MLB hitting stats scraper
        working-directory: workers
        run: node scrapeTeamHittingStats.js
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEBUG: 'true'

      ###################################################################
      # verify results
      ###################################################################
      - name: Verify scrape results
        if: always()
        run: |
          if [ -f "scrape-result.json" ]; then
            cat scrape-result.json
          else
            echo "::error::scrape-result.json not found"
            exit 1
          fi
