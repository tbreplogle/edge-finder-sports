name: Daily MLB Team Hitting Stats Update

on:
  schedule:
    - cron: '0 13 * * *'   # 8 AM CT
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 18

    # cache (package-lock at repo root)
    - name: Restore Node & Chrome caches
      id: restore-cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.npm
          ~/.cache/puppeteer
        key: linux-puppeteer-${{ hashFiles('package-lock.json') }}-v1
        restore-keys: |
          linux-puppeteer-

    - name: Install JS deps
      run: |
        npm ci --ignore-scripts
        if [ ! -d "$HOME/.cache/puppeteer" ]; then
          npx puppeteer@21.11.0 browsers install chrome
        fi

    - name: Save Node & Chrome caches
      if: steps.restore-cache.outputs.cache-hit != 'true'
      uses: actions/cache@v4
      with:
        path: |
          ~/.npm
          ~/.cache/puppeteer
        key: linux-puppeteer-${{ hashFiles('package-lock.json') }}-v1

    # --- rest of your steps stay exactly the same ---
    - name: Show environment information
      run: |
        echo "Node $(node -v) / npm $(npm -v)"
        pwd && ls -la
    # ... (Check secrets, run scraper, verify results) ...
