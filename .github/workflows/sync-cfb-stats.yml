name: Sync CFB Stats

on:
  schedule:
    # 12:00 UTC Monday == 07:00 AM US-Central (DST aware)
    - cron: '0 12 * * 1'
  workflow_dispatch:      # manual run button

jobs:
  sync-stats:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL:            ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CFBD_API_KEY:            ${{ secrets.CFBD_API_KEY }}
      PUPPETEER_SKIP_DOWNLOAD: 'true'   # you already set this for MLB

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 18 }

      # Re-use npm cache if you already cache in other workflows
      - name: Restore npm cache
        id: restore-cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: linux-npm-${{ hashFiles('**/package-lock.json') }}-v1
          restore-keys: |
            linux-npm-

      - name: Install deps (workers/)
        working-directory: workers
        run: npm install --no-audit --no-fund

      - name: Run syncCfbStats
        working-directory: workers
        run: node syncCfbStats.js
