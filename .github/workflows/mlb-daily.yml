name: MLB 🔒 lock & grade (single step)

on:
  schedule:
    - cron: '0 17 * * *'          # 12 PM CT
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PUPPETEER_CACHE_DIR:       /home/runner/puppeteer-cache
      CHROME_REVISION:           121.0.6167.85   # puppeteer-core v21 target

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with: { node-version: 18 }

    - name: Restore node-modules cache
      uses: actions/cache@v4
      with:
        path: workers/node_modules
        key: linux-npm-workers-${{ hashFiles('workers/package*.json') }}-v1
        restore-keys: |
          linux-npm-workers-

    - name: Restore Puppeteer cache
      uses: actions/cache@v4
      with:
        path: ${{ env.PUPPETEER_CACHE_DIR }}
        key: puppeteer-cache-${{ runner.os }}-v1

    - name: Install deps (workers/)
      working-directory: workers
      run: |
        if [ -f package-lock.json ]; then
          npm ci --no-audit --no-fund
        else
          npm install --no-audit --no-fund
        fi

    # *** key fix ***
    - name: Ensure Chrome present
      run: |
        npx puppeteer@21.7.0 browsers install chrome@${CHROME_REVISION}

    - name: Lock today & grade yesterday
      run: |
        echo "▶︎ Locking bets"
        node workers/lockDailyBets.js
        echo "▶︎ Grading yesterday"
        node workers/gradeDailyBets.js
