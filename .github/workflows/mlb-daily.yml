# .github/workflows/mlb-daily.yml  (snippet)
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PUPPETEER_CACHE_DIR:       /home/runner/puppeteer-cache   # <- job-level env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 18 }

      # ① Restore node_modules
      - uses: actions/cache@v4
        with:
          path: workers/node_modules
          key: linux-npm-workers-${{ hashFiles('workers/package*.json') }}-v1
          restore-keys: |
            linux-npm-workers-

      # ② Restore Puppeteer browser cache
      - uses: actions/cache@v4
        with:
          path: ${{ env.PUPPETEER_CACHE_DIR }}
          key: puppeteer-cache-${{ runner.os }}-v1

      # ③ Install deps
      - name: Install deps (workers/)
        working-directory: workers
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      # ④ **Download Chrome if the cache is empty**  (CRUCIAL)
      - name: Ensure Chrome present
        run: npx puppeteer browsers install chrome

      # ⑤ Run your workers
      - name: Lock today & grade yesterday
        run: |
          echo "▶︎ Locking bets"
          node workers/lockDailyBets.js
          echo "▶︎ Grading yesterday"
          node workers/gradeDailyBets.js
