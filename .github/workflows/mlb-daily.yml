name: MLB – lock & grade (single step)

on:
  schedule:
    - cron: '0 17 * * *'      # 12 PM CT
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PUPPETEER_CACHE_DIR:      /home/runner/puppeteer-cache

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 18 }

      # cache workers/ node_modules
      - uses: actions/cache@v4
        with:
          path: workers/node_modules
          key: linux-npm-workers-${{ hashFiles('workers/package.json', 'workers/package-lock.json') }}-v1
          restore-keys: |
            linux-npm-workers-

          # cache the puppeteer browser binary
      - uses: actions/cache@v4
        with:
          path: ${{ env.PUPPETEER_CACHE_DIR }}
          key: puppeteer-cache-${{ runner.os }}-v1

      - name: Install deps (workers/)
        working-directory: workers
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Lock today & grade yesterday
        run: |
          echo "▶︎ Locking bets"
          node workers/lockDailyBets.js
          echo "▶︎ Grading yesterday"
          node workers/gradeDailyBets.js
