name: MLB – lock bets & grade results

on:
  schedule:
    # 17 UTC = 12 PM CDT / 11 AM CST  → lock today’s bets
    - cron: '0 17 * * *'
    # 15 UTC = 10 AM CDT / 09 AM CST  → grade yesterday’s bets
    - cron: '0 15 * * *'
  workflow_dispatch:           # lets you trigger either job manually

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PUPPETEER_SKIP_DOWNLOAD:    'true'

    steps:
      # ───────── Checkout & Node ─────────
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 18 }

      # ───────── Restore workers/ cache ─────────
      - name: Restore npm cache (workers/)
        id: cache-workers
        uses: actions/cache@v4
        with:
          path: workers/node_modules
          key: linux-npm-workers-${{ hashFiles('workers/package.json', 'workers/package-lock.json') }}-v1
          restore-keys: |
            linux-npm-workers-

      # ───────── Install deps once (≈ fast after cache) ─────────
      - name: Install JS deps (workers/)
        working-directory: workers
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Save workers cache
        if: steps.cache-workers.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: workers/node_modules
          key: linux-npm-workers-${{ hashFiles('workers/package.json', 'workers/package-lock.json') }}-v1

      # ───────── Decide which job to run based on cron string ─────────
      # github.event.schedule is exactly the cron that triggered the run
      - name: Run locker or grader
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "Triggered by schedule: $SCHEDULE"
          if [[ "$SCHEDULE" == "0 17 * * *" ]]; then
            echo "▶︎ 12 PM CT — locking bets"
            node workers/lockDailyBets.js
          elif [[ "$SCHEDULE" == "0 15 * * *" ]]; then
            echo "▶︎ 09 AM CT — grading yesterday"
            node workers/gradeDailyBets.js
          else
            echo "Unexpected schedule; doing nothing." && exit 1
          fi
