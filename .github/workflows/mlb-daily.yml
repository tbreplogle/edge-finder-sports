name: MLB 🔒 lock & grade (single step)

on:
  schedule:
    - cron: '0 15 * * *'        # 12 PM CT
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PUPPETEER_SKIP_DOWNLOAD:   'true'                # stop npm from fetching Chrome
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome # Puppeteer will launch this

    steps:
      # ───────── checkout & node ─────────
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 18 }

      # ───────── cache node_modules (workers/) ─────────
      - name: Restore node-modules cache
        uses: actions/cache@v4
        with:
          path: workers/node_modules
          key: linux-npm-workers-${{ hashFiles('workers/package*.json') }}-v1
          restore-keys: |
            linux-npm-workers-

      # ───────── install deps (fast) ─────────
      - name: Install deps (workers/)
        working-directory: workers
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      # ───────── lock today & grade yesterday ─────────
      - name: Lock today & grade yesterday
        run: |
          echo "▶︎ Locking bets"
          node workers/lockDailyBets.js
          echo "▶︎ Grading yesterday"
          node workers/gradeDailyBets.js
      # ───────── fetch CLV ─────────
      - name: Backfill CLV from Odds API (past games only)
        env:
        ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      run: |
        echo "▶︎ Backfilling CLV (past games)"
        node workers/backfillMlbCLV.js
