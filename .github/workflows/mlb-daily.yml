name: MLB – lock bets & grade results

on:
  schedule:
    # ➜ 12:00 PM Central  (17 UTC in summer, 18 UTC in winter)
    - cron:  '0 17 * * *'
    # ➜ 09:00 AM Central  (14 UTC winter, 15 UTC summer)
    - cron:  '0 14 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PUPPETEER_SKIP_DOWNLOAD:    'true'

    steps:
      # checkout & deps
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 18 }
      - run: npm ci --prefix workers

      # choose which script to run based on UTC hour
      - name: Lock bets at noon / grade results in morning
        run: |
          hour=$(date -u +'%H')
          if [[ "$hour" == "17" ]]; then
            echo "▶︎ Noon CT – locking bets"
            node workers/lockDailyBets.js
          else
            echo "▶︎ Morning CT – grading yesterday"
            node workers/scrapeDailyResults.js
          fi
