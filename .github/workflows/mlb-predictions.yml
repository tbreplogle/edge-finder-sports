name: MLB Predictions

# Runs daily at 8:30 AM Central (CDT is UTC−5 → 13:30 UTC)
on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch:

jobs:
  run-mlb-predictions:
    runs-on: ubuntu-latest

    steps:
      # 1) Check out your repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2) Install the psql client
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # 3) Run our prediction SQL against Supabase
      - name: Run MLB predictions SQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # this single psql invocation will connect to your Supabase DB
          psql "$DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -f sql/mlb_predictions.sql
