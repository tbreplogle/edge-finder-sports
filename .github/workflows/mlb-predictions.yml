name: MLB Predictions

# Run every day at 8:30 AM Central (CDT = UTC−5 → 13:30 UTC)
on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch:

jobs:
  run-mlb-predictions:
    runs-on: ubuntu-latest

    steps:
      # 1) Check out your repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Install psql client
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # 3) Run your predictions SQL
      - name: Run MLB predictions SQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            -f sql/mlb_predictions.sql
