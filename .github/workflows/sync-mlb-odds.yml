name: Sync MLB Odds

on:
  schedule:
    - cron: '0 13 * * *'          # 08 AM CT
  workflow_dispatch:

jobs:
  sync-odds:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      ###################################################################
      # npm cache
      ###################################################################
      - name: Restore npm cache
        id: restore-cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: linux-npm-${{ hashFiles('workers/package-lock.json') }}-v1
          restore-keys: |
            linux-npm-

      ###################################################################
      # install deps
      ###################################################################
      - name: Install JS deps (workers/)
        working-directory: workers
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: npm install --no-audit --no-fund

      - name: Save npm cache
        if: steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: linux-npm-${{ hashFiles('workers/package-lock.json') }}-v1

      ###################################################################
      # sync odds
      ###################################################################
      - name: Sync MLB Odds
        working-directory: workers
        run: node fetchMlbOdds.js

      # Slack alert unchanged
      - name: Post to Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "❌ MLB Odds sync failed in ${{ github.repository }}",
              "blocks": [
                { "type": "section", "text": { "type": "mrkdwn", "text": "❌ *MLB Odds sync failed*" } },
                { "type": "section", "text": { "type": "mrkdwn", "text": "Repository: ${{ github.repository }}\nWorkflow: ${{ github.workflow }}\nSee: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" } }
              ]
            }
        env:
          SLACK_WEBHOOK_URL:  ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
